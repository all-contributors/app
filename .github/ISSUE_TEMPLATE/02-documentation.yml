name: 📝 Documentation

description: Report a typo or missing area of documentation

title: '📝 Documentation: <short description of the request>'

labels:
  - 'status: in discussion'
  - 'type: documentation'

body:
  - type: checkboxes
    attributes:
      description:
        If any of these required steps are not taken, we may not be able to
        review your issue. Help us to help you!
      label: Documentation Report Checklist
      options:
        - label: I have checked the latest `main` branch of the repository.
          required: true
        - label: I have [searched for related
            issues](https://github.com/all-contributors/app/issues?q=is%3Aissue)
            and found none that matched my issue.
          required: true
  - type: textarea
    attributes:
      description: What would you like to report?
      label: Overview
    validations:
      required: true
  - type: textarea
    attributes:
      description: Any additional info you'd like to provide.
      label: Additional Info
