on:
  push:
    branches:
      - main
  workflow_dispatch: ~

permissions:
  contents: write
  issues: write
  pull-requests: write

name: Release Please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Placeholder until Michael's GitHub App auth is wired up.
          # Swap this for an app-minted token from create-github-app-token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
